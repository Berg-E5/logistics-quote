<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户管理 · 报价后台</title>
<link rel="stylesheet" href="/ui-common.css">
  <link rel="stylesheet" href="/dash.css">
<link rel="stylesheet" href="/admin-common.css">
<style>
  /* ---------------- 本页专属 ---------------- */

  .role {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 5px;
    border: 1px solid var(--line2); white-space: nowrap; font-weight: 590;
  }
  .role.admin { border-color: var(--accent); color: var(--accenthi); background: var(--accentdim); }
  .role.user  { border-color: #5b9fe8; color: #8fc5ff; background: rgba(64, 139, 220, .12); }
  .role.system { border-color: var(--warn); color: var(--warn); background: var(--warndim); }
  .status-off { color: var(--bad); border-color: var(--bad); background: var(--baddim); }
  .status-temp { color: var(--warn); border-color: var(--warn); background: var(--warndim); }

  .delbtn {
    color: var(--bad); border-color: transparent; background: transparent;
    font-size: 12.5px; font-weight: 510;
  }
  .delbtn:hover { background: var(--baddim); border-color: var(--bad); }
  .delbtn:disabled { opacity: .3; }

  /* 有数据 / 未上传 */
  .hasdata { color: var(--good); font-weight: 590; }
  /* 账号卡片 */
  .ucards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .ucard {
    background: linear-gradient(180deg, var(--ov-1), transparent 60%), var(--panel);
    border: 1px solid var(--line-2); border-radius: 10px; padding: 14px 16px 13px;
    position: relative; overflow: hidden;
    box-shadow: inset 0 1px 0 var(--ov-4), 0 18px 40px -30px var(--shadow-deep);
    display: flex; flex-direction: column; gap: 12px;
  }
  /* 左侧角色色条: 管理员琥珀, 普通用户蓝 —— 一眼分清 */
  .ucard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--accent); opacity: .55; }
  .ucard:has(.avatar.admin)::before { background: var(--warn); opacity: .7; }
  .ucard:hover { border-color: var(--line-3); }
  .uc-top { display: flex; align-items: center; gap: 10px; }
  .uc-top .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; text-transform: uppercase;
  }
  .uc-top .avatar.admin { background: var(--warn); }
  .uc-id { display: flex; align-items: baseline; gap: 6px; flex: 1; min-width: 0; }
  .uc-id b { font-size: 14px; font-weight: 590; color: var(--fg); }
  .uc-id .muted { font-size: 11px; }
  .uc-meta { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 14px; }
  .uc-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .uc-cell span { font-size: 10px; color: var(--dim); letter-spacing: .3px; }
  .uc-cell b {
    font-size: 12.5px; font-weight: 560; color: var(--fg-2);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .uc-cell b.ok { color: var(--good); }
  .uc-acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; padding-top: 2px;
             border-top: 1px solid var(--line); margin-top: -2px; padding-top: 11px; }
  .uc-acts button { padding: 5px 8px; font-size: 11.5px; }
  .ucard.disabled { opacity: .72; }
  .utabs { display: inline-flex; gap: 3px; padding: 3px; border-radius: 9px;
           border: 1px solid var(--line); background: var(--ov-3); margin: 3px 0 14px; }
  .utabs button { border: 0; background: transparent; box-shadow: none; padding: 7px 16px; color: var(--muted); }
  .utabs button.on { background: var(--panel-3); color: var(--fg); font-weight: 590; box-shadow: inset 0 1px 0 var(--ov-4); }
  .utabs .n { margin-left: 5px; color: var(--muted); font-size: 10.5px; }
  .copybox { white-space: pre-wrap; background: var(--panel2); border: 1px solid var(--line2);
             border-radius: 8px; padding: 12px; font: 12px/1.7 var(--mono); color: var(--fg2);
             user-select: text; }
  .utable tbody tr { cursor: pointer; }
  .utable tbody tr.selected { background: var(--accentdim); box-shadow: inset 3px 0 0 var(--accent); }
  .utable .u-name { display:flex; align-items:center; gap:8px; }
  .utable .u-name .avatar { width:25px; height:25px; border-radius:7px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:10.5px; font-weight:700; }
  .utable .u-name .avatar.admin { background:var(--warn); }
  .utable .u-name b { font-family:var(--mono); font-size:12px; }
  .utable .muted { font-size:11px; }
  .drawer-scrim { position:fixed; inset:0; background:transparent; z-index:54; }
  .udrawer {
    position:fixed; top:0; right:0; bottom:0; width:min(430px,96vw); z-index:55;
    background:var(--panel); border-left:1px solid var(--line2);
    box-shadow:-24px 0 60px -32px var(--shadow-deep); padding:20px;
    overflow:auto;
  }
  .udrawer h3 { margin:0 0 2px; font:600 17px var(--mono); }
  .udrawer .sub { color:var(--muted); font-size:12px; margin-bottom:18px; }
  .udrawer .dgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:15px 0; }
  .udrawer .dcell { padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  .udrawer .dcell span { display:block; color:var(--dim); font-size:10px; }
  .udrawer .dcell b { display:block; color:var(--fg2); font-size:12px; margin-top:3px; }
  .udrawer .dactions { display:flex; flex-direction:column; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .udrawer .dactions button { text-align:left; }

  .nodata {
    display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--warn); color: var(--warn); background: var(--warndim); font-weight: 590;
  }

  /* 被锁的 IP 行 */
  #lockrows tr.locked { background: var(--warndim); box-shadow: inset 3px 0 0 var(--warn); }
  #lockrows tr.locked td { border-bottom-color: var(--warn-dim); }
  #lockrows .ip {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: var(--fg);
  }
  .unlockbtn {
    color: var(--warn); border-color: var(--warn); background: var(--warndim); font-weight: 510;
  }
  .unlockbtn:hover { background: var(--warn-dim); border-color: var(--warn); }
  #unlockall { border-color: var(--warn); color: var(--warn); }
  #unlockall:hover { background: var(--warndim); border-color: var(--warn); }
  .lockcount { font-weight: 590; color: var(--warn); }
  .lockcount.zero { color: var(--muted); font-weight: 400; }

  /* 有被锁 IP 时, 面板整体变成琥珀色警示 */
  #lockpane.has-locks {
    border-color: var(--warn);
    box-shadow: 0 0 0 1px var(--warn-dim), 0 0 24px -8px var(--warn-dim);
  }
  #lockpane.has-locks h3 { color: var(--warn); }
  .lockbadge {
    display: inline-block; font-size: 11px; font-weight: 590; padding: 1px 8px; border-radius: 999px;
    margin-left: 8px; border: 1px solid var(--warn); color: var(--warn);
    background: var(--warndim); vertical-align: 2px;
  }
  #unlockall.solid { background: var(--warn); border-color: var(--warn); color: var(--on-warn); font-weight: 590; }
  #unlockall.solid:hover { background: var(--warn-hi); }

  .newgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .newgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .newgrid input, .newgrid select { width: 100%; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .tablewrap table { min-width: 520px; }
</style>
<script>
/* 主题: 首帧前定好, 否则会闪一下。跟随系统由 CSS 媒体查询接管, JS 只记选择。 */
(function () {
  try {
    var v = localStorage.getItem('quote.theme');
    if (v !== 'light' && v !== 'dark') v = 'auto';
    var el = document.documentElement;
    el.setAttribute('data-theme', v);
    var sysDark = true;
    try { sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) {}
    el.setAttribute('data-theme-effective', v === 'auto' ? (sysDark ? 'dark' : 'light') : v);
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>

<script src="/vue.global.prod.js"></script>
<script src="/admin-common.js"></script>
<script>
const A = window.QuoteAdmin;
const { createApp, ref, computed, onMounted } = Vue;

createApp({
  components: {
    AppSidebar: A.AppSidebar, AppHeader: A.AppHeader,
    LoginGate: A.LoginGate, PasswordModal: A.PasswordModal, DialogHost: A.DialogHost,
  },
  setup() {
    const { logged, checking, me, mustChange, afterLogin, reset: resetAuth } = A.useAuth(async () => {
      await onAuthed();
    });
    const version = ref('读取中…');
    const users = ref([]);
    const locks = ref([]);
    const lockErr = ref('');
    const loadErr = ref('');
    const showPwd = ref(false);
    const busy = ref(false);

    // 新增用户表单
    const nUser = ref('');
    const nPass = ref('');
    const addErr = ref('');
    const addOk = ref('');
    const urlParams = new URLSearchParams(location.search);
    const userTab = ref(urlParams.get('tab') === 'admins' ? 'admins' : 'members');
    const userQuery = ref(urlParams.get('q') || '');
    const userStatus = ref('all');
    const createdAccount = ref(null);
    const copyMsg = ref('');
    const resetTarget = ref(null);
    const resetPass = ref('');
    const resetErr = ref('');
    const selectedUser = ref(null);

    const isSystem = computed(() => !!me.value.system);
    const tabUsers = computed(() => users.value.filter(u => {
      if (userTab.value === 'admins' ? u.role !== 'admin' : u.role !== 'user') return false;
      if (userStatus.value === 'disabled' && !u.disabled) return false;
      if (userStatus.value === 'active' && u.disabled) return false;
      if (userStatus.value === 'temp' && !u.mustChangePassword) return false;
      const q = userQuery.value.trim().toLowerCase();
      return !q || [u.username, u.ownerAdmin, u.dataOwner]
        .some(v => String(v || '').toLowerCase().includes(q));
    }));
    const countText = computed(() =>
      userTab.value === 'admins'
        ? `共 ${tabUsers.value.length} 个管理员`
        : `共 ${tabUsers.value.length} 个普通用户`);
    const lockCountText = computed(() => {
      if (lockErr.value) return '读取失败: ' + lockErr.value;
      return locks.value.length ? `有 ${locks.value.length} 个 IP 被锁` : '没有被锁的 IP';
    });

    async function refreshVersion() {
      try {
        const v = await A.api('/api/version');
        version.value = '数据版本 v' + v.rev
          + (v.updatedAt ? ' · ' + new Date(v.updatedAt).toLocaleString('zh-CN') : '');
      } catch (e) { version.value = '数据版本读取失败'; }
    }

    const dataOwnerCount = computed(() => new Set(
      users.value.filter(u => u.hasData).map(u => u.dataOwner || u.username)
    ).size);
    /** 每个账号一根迷你条: 长度按「数据规模」相对最大值缩放,
        一眼看出谁的数据多、谁基本没在用。 */
    const userSpark = computed(() => {
      const a = users.value;
      if (!a.length) return [];
      const sz = a.map(u => Number(u.tiers || u.tierCount || 0));
      const mx = Math.max.apply(null, sz.concat([1]));
      return a.map(u => Math.round(12 + 88 * (Number(u.tiers || u.tierCount || 0)) / mx));
    });
    const adminCount = computed(() => users.value.filter(u => u.role === 'admin').length);
    const memberCount = computed(() => users.value.filter(u => u.role === 'user').length);
    const serverAddress = computed(() => me.value.serverMode === 'local'
      ? '本机独立模式（账号和价格表仅本机可用）'
      : location.origin);

    async function loadUsers() {
      loadErr.value = '';
      try {
        const j = await A.api('/api/users');
        users.value = j.users || [];
        if (selectedUser.value) {
          selectedUser.value = users.value.find(u => u.username === selectedUser.value.username) || null;
        }
      } catch (e) {
        loadErr.value = e.message;
        users.value = [];
      }
      await refreshVersion();
    }

    async function loadLocks() {
      lockErr.value = '';
      if (!isSystem.value) {
        locks.value = [];
        return;
      }
      try {
        const j = await A.api('/api/rate-locks');
        locks.value = j.locks || [];
      } catch (e) {
        lockErr.value = e.message;
        locks.value = [];
      }
    }

    function lockRemain(sec) {
      const m = Math.floor(sec / 60), s = sec % 60;
      return m > 0 ? `${m} 分 ${s} 秒` : `${s} 秒`;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      }
    }

    function inviteText(account) {
      return `服务器：${account.server}\n用户名：${account.username}\n所属管理员：${account.owner || '无（管理员账号）'}\n临时密码：${account.password}\n\n首次登录必须修改密码。`;
    }

    async function copyCreated() {
      if (!createdAccount.value) return;
      const ok = await copyText(inviteText(createdAccount.value));
      copyMsg.value = ok ? '登录信息已复制' : '复制失败，请手动选择文本';
      if (ok) A.notify('登录信息已复制', 'ok');
    }

    async function toggleDisabled(u) {
      const next = !u.disabled;
      if (!await A.confirmAction({
        title: `${next ? '停用' : '启用'}账号`,
        message: `${next ? '停用' : '启用'}账号「${u.username}」吗？\n${next ? '该账号的现有登录会立即失效。' : '启用后账号可以重新登录。'}`,
        confirmText: next ? '停用账号' : '启用账号',
        danger: next,
      })) return;
      try {
        await A.api('/api/users/' + encodeURIComponent(u.username) + '/status', {
          method: 'PATCH', body: { disabled: next },
        });
        await loadUsers();
        A.notify(`已${next ? '停用' : '启用'}「${u.username}」`, 'ok');
      } catch (e) {
        loadErr.value = (next ? '停用失败: ' : '启用失败: ') + e.message;
      }
    }

    function openReset(u) {
      resetTarget.value = u;
      resetPass.value = '';
      resetErr.value = '';
    }

    async function submitReset() {
      resetErr.value = '';
      if (resetPass.value.length < 8) { resetErr.value = '临时密码至少 8 位'; return; }
      busy.value = true;
      try {
        await A.api('/api/users/' + encodeURIComponent(resetTarget.value.username) + '/reset-password', {
          method: 'POST', body: { password: resetPass.value },
        });
        createdAccount.value = {
          server: serverAddress.value,
          username: resetTarget.value.username,
          owner: resetTarget.value.role === 'user' ? resetTarget.value.ownerAdmin : null,
          password: resetPass.value,
          role: resetTarget.value.role,
          reset: true,
        };
        copyMsg.value = '';
        resetTarget.value = null;
        resetPass.value = '';
        await loadUsers();
        A.notify('密码已重置，旧会话已撤销', 'ok');
      } catch (e) {
        resetErr.value = e.message;
      } finally {
        busy.value = false;
      }
    }

    async function revokeSessions(u) {
      if (!await A.confirmAction({
        title: '退出所有设备',
        message: `让「${u.username}」在所有设备退出登录吗？`,
        confirmText: '退出所有设备',
      })) return;
      try {
        await A.api('/api/users/' + encodeURIComponent(u.username) + '/sessions', { method: 'DELETE' });
        loadErr.value = `已让「${u.username}」退出所有设备`;
        A.notify('已撤销该账号的全部会话', 'ok');
      } catch (e) {
        loadErr.value = '操作失败: ' + e.message;
      }
    }

    async function delUser(u) {
      const isAdmin = u.role === 'admin';
      const canDel = !isAdmin && u.username !== me.value.user;
      if (!canDel) return;
      const extra = u.hasData ? `，包括它的 ${u.tiers} 条费率数据和全部改动记录` : '';
      if (!await A.confirmAction({
        title: '删除账号',
        message: `确定删除账号「${u.username}」吗？${extra}\n删了就找不回来了。`,
        confirmText: '删除账号',
        danger: true,
      })) return;
      try {
        await A.api('/api/users/' + encodeURIComponent(u.username), { method: 'DELETE' });
        await loadUsers();
        A.notify(`已删除「${u.username}」`, 'ok');
      } catch (e) {
        loadErr.value = '删除失败: ' + e.message;
      }
    }

    async function unlockOne(ip) {
      if (!await A.confirmAction({ title: '解封 IP', message: `确定解封 ${ip} 吗？`, confirmText: '解封' })) return;
      try {
        await A.api('/api/rate-locks/' + encodeURIComponent(ip), { method: 'DELETE' });
        await loadLocks();
      } catch (e) {
        lockErr.value = '解封失败: ' + e.message;
      }
    }

    async function unlockAll() {
      if (!await A.confirmAction({ title: '全部解封', message: '确定把所有被锁的 IP 全部解封吗？', confirmText: '全部解封' })) return;
      try {
        const r = await A.api('/api/rate-locks', { method: 'DELETE' });
        await loadLocks();
        loadErr.value = '';
        // 用行内提示代替 alert
        unlockMsg.value = `已解封 ${r.cleared} 条`;
        A.notify(`已解封 ${r.cleared} 条 IP 锁定`, 'ok');
      } catch (e) {
        lockErr.value = '解封失败: ' + e.message;
      }
    }
    const unlockMsg = ref('');

    async function addUser() {
      addErr.value = ''; addOk.value = '';
      const username = nUser.value.trim();
      if (!username || !nPass.value) { addErr.value = '用户名和初始密码都要填'; return; }
      if (nPass.value.length < 8) { addErr.value = '初始密码至少 8 位'; return; }
      busy.value = true;
      try {
        const role = userTab.value === 'admins' ? 'admin' : 'user';
        await A.api('/api/users', {
          method: 'POST',
          body: {
            username,
            password: nPass.value,
            role,
            forcePasswordChange: true,
          },
        });
        createdAccount.value = {
          server: serverAddress.value,
          username,
          owner: role === 'user' ? me.value.user : null,
          password: nPass.value,
          role,
          reset: false,
        };
        copyMsg.value = '';
        addOk.value = `已创建${role === 'admin' ? '管理员' : '普通用户'}「${username}」，请把登录信息交给对方`;
        nUser.value = ''; nPass.value = '';
        await loadUsers();
        A.notify('账号已创建，请复制登录信息给用户', 'ok');
      } catch (e) {
        addErr.value = e.message;
      } finally {
        busy.value = false;
      }
    }

    /** 登录成功后加载本页数据 (由 useAuth 的回调触发) */
    async function onAuthed() {
      if (me.value.role !== 'admin') {
        location.replace('/');
        return;
      }
      if (!me.value.system) {
        userTab.value = 'members';
        userQuery.value = '';
      }
      await refreshVersion();
      await loadUsers();
      await loadLocks();
    }

    async function logout() {
      try { await A.api('/api/logout', { method: 'POST' }); } catch (e) { /* ignore */ }
      location.href = '/admin';
    }

    onMounted(async () => {
      try { await afterLogin(); }
      catch (e) { logged.value = false; }
    });

    return {
      logged, checking, me, mustChange, version, users, locks, lockErr, loadErr, showPwd, busy,
      nUser, nPass, addErr, addOk, unlockMsg, isSystem, userTab, tabUsers,
      userQuery, userStatus,
      createdAccount, copyMsg, resetTarget, resetPass, resetErr, selectedUser, memberCount, serverAddress,
      countText, dataOwnerCount, adminCount, lockCountText, userSpark, loadUsers, loadLocks, lockRemain,
      delUser, unlockOne, unlockAll, addUser, afterLogin, logout,
      copyCreated, inviteText, toggleDisabled, openReset, submitReset, revokeSessions,
    };
  },
  template: `
    <div>
      <AppSidebar
        :user="logged ? me.user : ''"
        :system="me.system"
        :workspace="me.dataScope"
      />
      <AppHeader
        title="用户管理"
        :version="version"
        :user="me.user"
        :role="me.role"
        :system="me.system"
        :workspace="me.dataScope"
        :workspace-meta="version"
        :links="[]"
        @logout="logout"
        @password="showPwd = true"
      />

      <main>
        <template v-if="checking">
          <div class="gate"><p class="muted">正在检查登录状态…</p></div>
        </template>

        <template v-else-if="!logged">
          <LoginGate msg="用户管理只有管理员能进。请用管理员账号登录。" @login="afterLogin" />
        </template>


        <template v-else>
          <div class="dash">
            <div class="dash-inner">
              <div class="metrics">
                <div class="metric">
                  <span class="mk">账号</span><b class="mv">{{ users.length }}</b>
                  <span class="ms">{{ countText }}</span>
                </div>
                <div class="metric k-new">
                  <span class="mk">价格表</span><b class="mv">{{ dataOwnerCount }}</b>
                  <span class="ms">已有报价数据的独立账户</span>
                </div>
                <div class="metric k-lock" v-if="isSystem">
                  <span class="mk">登录锁定</span><b class="mv">{{ locks.length }}</b>
                  <span class="ms">待总管理员解封</span>
                </div>
                <div class="metric k-chg">
                  <span class="mk">{{ isSystem ? '管理员' : '我的身份' }}</span>
                  <b class="mv">{{ isSystem ? adminCount : '管理员' }}</b>
                  <span class="ms">{{ isSystem ? '各自维护独立价格表' : '只管理自己名下用户' }}</span>
                </div>
              </div>
              <div class="dash-spark" v-if="userSpark.length" title="每个账号的费率档数量 (相对最大值)">
                <i v-for="(v, i) in userSpark" :key="i" :style="{height: v + '%'}"
                   :class="{on: v > 40, hot: v > 90}"></i>
              </div>
              <div class="grow"></div>
              <span class="ov-keys"><kbd>/</kbd> 搜索 <kbd>Esc</kbd> 关闭面板</span>
            </div>
          </div>

          <div class="bar">
            <span class="muted">{{ countText }}</span>
            <input v-model="userQuery" type="search" placeholder="搜索用户名、归属或工作区…" style="min-width:240px">
            <select v-model="userStatus">
              <option value="all">全部状态</option>
              <option value="active">正常账号</option>
              <option value="disabled">已停用</option>
              <option value="temp">待首次改密</option>
            </select>
            <span style="flex:1"></span>
            <span class="err" style="margin:0" v-if="loadErr">{{ loadErr }}</span>
            <button @click="loadUsers">刷新</button>
          </div>

          <div class="utabs" v-if="isSystem" role="tablist" aria-label="账号类型">
            <button role="tab" :aria-selected="userTab === 'admins'"
                    :class="{on: userTab === 'admins'}" @click="userTab = 'admins'">
              管理员账号<span class="n">{{ adminCount }}</span>
            </button>
            <button role="tab" :aria-selected="userTab === 'members'"
                    :class="{on: userTab === 'members'}" @click="userTab = 'members'">
              普通用户<span class="n">{{ memberCount }}</span>
            </button>
          </div>

          <div class="tablewrap" v-if="tabUsers.length" style="max-height:calc(100vh - 330px)">
            <table class="utable">
              <thead><tr>
                <th>账号</th><th>角色 / 归属</th><th>价格表</th><th>最后登录</th><th>状态</th><th style="width:120px">操作</th>
              </tr></thead>
              <tbody>
                <tr v-for="u in tabUsers" :key="u.username" :class="{selected: selectedUser && selectedUser.username === u.username}" @click="selectedUser = u">
                  <td><div class="u-name"><span class="avatar" :class="{admin:u.role==='admin'}">{{ u.username.charAt(0).toUpperCase() }}</span><b>{{ u.username }}</b></div></td>
                  <td><span class="role" :class="u.system ? 'system' : u.role">{{ u.system ? '总管理员' : (u.role === 'admin' ? '管理员' : '普通用户') }}</span><br><small class="muted">{{ u.role === 'admin' ? u.username : u.ownerAdmin }}</small></td>
                  <td><b v-if="u.hasData">{{ u.shared ? '共享 ' : '' }}{{ u.tiers }} 条</b><span v-else class="muted">未导入</span><br><small class="muted">{{ u.hasData ? 'v'+u.rev : '—' }}</small></td>
                  <td>{{ u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleString('zh-CN') : '从未登录' }}</td>
                  <td><span class="role status-off" v-if="u.disabled">已停用</span><span class="role status-temp" v-else-if="u.mustChangePassword">待改密</span><span v-else class="ok">正常</span></td>
                  <td><button @click.stop="selectedUser = u">详情</button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="tablewrap" v-else style="margin-bottom:16px">
            <div class="empty">{{ userTab === 'admins' ? '没有符合条件的管理员账号' : '没有符合条件的普通用户账号' }}</div>
          </div>

          <!-- 登录锁定面板 -->
          <div class="pane" id="lockpane" v-if="isSystem" :class="{'has-locks': locks.length > 0}">
            <h3>
              登录锁定（被锁定的 IP）
              <span class="lockbadge" v-if="locks.length">{{ locks.length }} 个待解封</span>
            </h3>
            <p class="muted" style="margin:0 0 10px;font-size:12.5px">
              同一 IP 登录失败 8 次会锁 5 分钟；同一 IP 一小时注册超过 5 个也会锁。
              <b>锁了只能由管理员在这里解封</b>，用户自己没法解锁。
            </p>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
              <span class="lockcount" :class="{zero: !locks.length}">{{ lockCountText }}</span>
              <span class="ok" style="font-size:12.5px" v-if="unlockMsg">{{ unlockMsg }}</span>
              <span style="flex:1"></span>
              <button id="unlockall" :class="{solid: locks.length > 0}" :disabled="!locks.length" @click="unlockAll">全部解封</button>
              <button @click="loadLocks">刷新</button>
            </div>
            <div class="tablewrap">
              <table>
                <thead>
                  <tr>
                    <th>IP</th>
                    <th style="width:110px">原因</th>
                    <th style="width:80px" class="num">失败次数</th>
                    <th style="width:120px">剩余</th>
                    <th style="width:80px">操作</th>
                  </tr>
                </thead>
                <tbody id="lockrows">
                  <tr v-for="l in locks" :key="l.ip" class="locked">
                    <td class="ip"><code>{{ l.ip }}</code></td>
                    <td>{{ l.kind === 'login' ? '登录失败' : '注册太频繁' }}</td>
                    <td class="num">{{ l.count }}</td>
                    <td class="muted">{{ lockRemain(l.remainSec) }}</td>
                    <td><button class="unlockbtn" @click="unlockOne(l.ip)">解封</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div id="lockempty" class="muted" style="padding:14px;text-align:center" v-if="!locks.length">
              当前没有被锁定的 IP
            </div>
          </div>

          <!-- 新增用户 -->
          <div class="pane">
            <h3>{{ userTab === 'admins' ? '新增管理员' : '新增普通用户' }}</h3>
            <div class="newgrid">
              <label>用户名<input v-model="nUser" placeholder="字母数字, 2-32 位"></label>
              <label>{{ userTab === 'admins' ? '管理员初始密码' : '普通用户初始密码' }}
                <input v-model="nPass" type="text" placeholder="至少 8 位，只显示一次">
              </label>
              <label style="justify-content:flex-end">
                <button class="primary" :disabled="busy" @click="addUser">
                  {{ busy ? '创建中…' : (userTab === 'admins' ? '创建管理员' : '创建普通用户') }}
                </button>
              </label>
            </div>
            <div class="hint" v-if="userTab === 'admins'">
              管理员拥有独立工作区、价格表和成员列表，看不到其他管理员的数据。
            </div>
            <div class="hint" v-else>
              新账号归属 {{ me.user }}，只读查看 {{ me.user }} 的价格表。首次登录必须修改临时密码。
            </div>
            <div class="err" style="margin-top:6px" v-if="addErr">{{ addErr }}</div>
            <div class="ok" style="font-size:12.5px" v-if="addOk">{{ addOk }}</div>
          </div>
        </template>
      </main>

      <div class="drawer-scrim" v-if="selectedUser" @click="selectedUser = null"></div>
      <aside class="udrawer" v-if="selectedUser" aria-label="账号详情">
        <button style="float:right" @click="selectedUser = null">关闭</button>
        <h3>{{ selectedUser.username }}</h3>
        <div class="sub">{{ selectedUser.system ? '总管理员账号' : (selectedUser.role === 'admin' ? '独立工作区管理员' : '普通用户') }}</div>
        <span class="role" :class="selectedUser.system ? 'system' : selectedUser.role">{{ selectedUser.system ? '总管理员' : (selectedUser.role === 'admin' ? '管理员' : '普通用户') }}</span>
        <span class="role status-off" v-if="selectedUser.disabled" style="margin-left:6px">已停用</span>
        <span class="role status-temp" v-else-if="selectedUser.mustChangePassword" style="margin-left:6px">待首次改密</span>
        <div class="dgrid">
          <div class="dcell"><span>数据归属</span><b>{{ selectedUser.role === 'admin' ? selectedUser.username : selectedUser.ownerAdmin }}</b></div>
          <div class="dcell"><span>价格表版本</span><b>{{ selectedUser.hasData ? 'v'+selectedUser.rev : '未导入' }}</b></div>
          <div class="dcell"><span>费率档</span><b>{{ selectedUser.tiers || 0 }} 条</b></div>
          <div class="dcell"><span>最后登录</span><b>{{ selectedUser.lastLoginAt ? new Date(selectedUser.lastLoginAt).toLocaleString('zh-CN') : '从未登录' }}</b></div>
          <div class="dcell"><span>创建时间</span><b>{{ selectedUser.createdAt ? new Date(selectedUser.createdAt).toLocaleDateString('zh-CN') : '—' }}</b></div>
          <div class="dcell"><span>登录方式</span><b>账号密码</b></div>
        </div>
        <div class="dactions" v-if="selectedUser.username !== me.user">
          <button @click="openReset(selectedUser)">重置临时密码</button>
          <button @click="revokeSessions(selectedUser)">退出所有设备</button>
          <button @click="toggleDisabled(selectedUser)">{{ selectedUser.disabled ? '启用这个账号' : '停用这个账号' }}</button>
          <button class="delbtn" v-if="selectedUser.role !== 'admin'" @click="delUser(selectedUser)">删除账号</button>
        </div>
        <p v-else class="muted" style="font-size:12px">这是当前登录账号，请通过右上角菜单修改自己的密码。</p>
      </aside>

      <PasswordModal :show="showPwd || mustChange" :required="mustChange" @close="showPwd = false" />
      <DialogHost />

      <div class="modal" v-if="createdAccount" @click.self="createdAccount = null">
        <div class="mbox" style="max-width:520px">
          <h3>{{ createdAccount.reset ? '密码已重置' : '账号已创建' }}</h3>
          <p class="muted" style="font-size:12.5px">
            临时密码只显示这一次。对方首次登录后必须修改密码。
          </p>
          <div class="copybox">{{ inviteText(createdAccount) }}</div>
          <div class="ok" style="font-size:12.5px;min-height:18px;margin-top:8px">{{ copyMsg }}</div>
          <div class="row">
            <button class="primary" @click="copyCreated">复制登录信息</button>
            <button @click="createdAccount = null">关闭</button>
          </div>
        </div>
      </div>

      <div class="modal" v-if="resetTarget" @click.self="resetTarget = null">
        <div class="mbox">
          <h3>重置「{{ resetTarget.username }}」的密码</h3>
          <p class="muted" style="font-size:12.5px">
            重置后该账号所有设备立即退出，下次登录必须修改临时密码。
          </p>
          <label>临时密码<input v-model="resetPass" type="text" autocomplete="off" placeholder="至少 8 位"></label>
          <div class="err">{{ resetErr }}</div>
          <div class="row">
            <button @click="resetTarget = null">取消</button>
            <button class="primary" :disabled="busy" @click="submitReset">确认重置</button>
          </div>
        </div>
      </div>
    </div>
  `,
}).mount('#root');
</script>
</body>
</html>
