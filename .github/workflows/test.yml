name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node syntax
        run: |
          git ls-files -z '*.js' | xargs -0 -n1 node --check
      - name: Tests
        run: node --test
      - name: Python syntax
        run: python -m compileall -q 脚本 deploy
      - name: Shell syntax
        run: bash -n deploy/install.sh deploy/bootstrap.sh deploy/release.sh deploy/backup.sh docker/entrypoint.sh
