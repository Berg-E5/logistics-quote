name: Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit
      - name: Build unsigned NSIS installer
        run: npm run dist
      - name: Verify installer
        shell: powershell
        run: |
          $installer = Get-ChildItem "dist\LogisticsQuote-Setup-*-x64.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced" }
          if ($installer.Length -lt 20MB) { throw "Installer is unexpectedly small" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName |
            Format-List | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/dist/LogisticsQuote-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach installer to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/LogisticsQuote-Setup-*-x64.exe
          generate_release_notes: true
