# 物流报价网站 —— quote.byberg.store
#
# 后端: 127.0.0.1:8792 (systemd: quote-server)

server {
    listen 80;
    listen [::]:80;
    server_name quote.byberg.store;

    # ACME http-01 challenge —— acme.sh webroot 模式续签用, 永不要动
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/quote.byberg.store;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quote.byberg.store;

    ssl_certificate     /etc/nginx/ssl/quote.byberg.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/quote.byberg.store/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/quote.byberg.store/chain.pem;

    # 现代 TLS (与这台机器其它站点保持一致)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
