<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>创建管理员账户</title>
  <style>
    :root { color-scheme: light dark; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 18% 10%, #17445d 0, #0b1220 42%, #070d18 100%);
      color: #e8f0fa;
    }
    .card {
      width: 470px; padding: 34px 36px 30px; border-radius: 20px;
      background: rgba(15, 29, 48, .94); border: 1px solid rgba(124, 210, 230, .24);
      box-shadow: 0 28px 70px rgba(0, 0, 0, .45); backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .brand img { width: 56px; height: 56px; border-radius: 13px; }
    .brand small { color: #77d7ce; font-size: 12px; letter-spacing: .12em; }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    .lead { color: #a9bad0; font-size: 13.5px; line-height: 1.7; margin: 0 0 24px; }
    .account {
      display: flex; justify-content: space-between; padding: 11px 13px;
      border-radius: 9px; background: #0a1727; border: 1px solid #223954;
      margin-bottom: 17px; color: #9fb3ca; font-size: 13px;
    }
    .account b { color: #e8f0fa; font-family: ui-monospace, Consolas, monospace; }
    label { display: block; color: #c8d6e7; font-size: 12.5px; margin: 14px 0 7px; }
    input {
      width: 100%; padding: 12px 13px; border-radius: 9px; border: 1px solid #29425e;
      background: #081422; color: #fff; font: inherit; font-size: 14px; outline: none;
    }
    input:focus { border-color: #28b8bf; box-shadow: 0 0 0 3px rgba(40, 184, 191, .14); }
    .hint { min-height: 18px; margin-top: 8px; color: #e7b86d; font-size: 12px; }
    .err { min-height: 20px; margin: 12px 0 4px; color: #ff8c93; font-size: 12.5px; }
    .actions { display: flex; gap: 10px; margin-top: 14px; }
    button {
      border: 1px solid #35506e; border-radius: 9px; padding: 11px 16px;
      font: inherit; cursor: pointer; color: #d7e3f0; background: #15273c;
    }
    button.primary { flex: 1; background: linear-gradient(135deg, #17a8b4, #34c4a9); border: 0; color: #04141a; font-weight: 700; }
    button:disabled { opacity: .6; cursor: wait; }
    .foot { margin-top: 16px; color: #71859d; font-size: 11.5px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="assets/icon.png" alt="">
      <div><small>LOGISTICS QUOTE</small><h1 id="title">创建管理员账户</h1></div>
    </div>
    <p class="lead" id="lead">首次使用需要设置本地管理员密码。密码仅以加盐哈希保存，不会保存明文。</p>
    <form id="form">
      <label for="username">管理员用户名</label>
      <input id="username" type="text" autocomplete="username" minlength="2" maxlength="32" value="admin" required>
      <label for="password">管理员密码</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <label for="confirm">确认密码</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <div class="hint">至少 8 位，建议包含字母、数字和符号。</div>
      <div class="err" id="error"></div>
      <div class="actions">
        <button type="button" id="cancel">取消</button>
        <button class="primary" id="submit" type="submit">创建管理员并进入系统</button>
      </div>
    </form>
    <div class="foot">创建后登录管理员。普通账号由管理员在“用户管理”中创建，并只读访问共享价格表。</div>
  </main>
  <script src="setup.js"></script>
</body>
</html>
