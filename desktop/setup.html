<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连接中央服务器</title>
  <style>
    :root { color-scheme: light dark; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 18% 10%, #17445d 0, #0b1220 42%, #070d18 100%);
      color: #e8f0fa;
    }
    .card {
      width: 500px; padding: 28px 34px 26px; border-radius: 20px;
      background: rgba(15, 29, 48, .94); border: 1px solid rgba(124, 210, 230, .24);
      box-shadow: 0 28px 70px rgba(0, 0, 0, .45); backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .brand img { width: 56px; height: 56px; border-radius: 13px; }
    .brand small { color: #77d7ce; font-size: 12px; letter-spacing: .12em; }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    .lead { color: #a9bad0; font-size: 13.5px; line-height: 1.65; margin: 0 0 17px; }
    .account {
      display: flex; justify-content: space-between; padding: 11px 13px;
      border-radius: 9px; background: #0a1727; border: 1px solid #223954;
      margin-bottom: 17px; color: #9fb3ca; font-size: 13px;
    }
    .account b { color: #e8f0fa; font-family: ui-monospace, Consolas, monospace; }
    label { display: block; color: #c8d6e7; font-size: 12.5px; margin: 11px 0 6px; }
    input {
      width: 100%; padding: 12px 13px; border-radius: 9px; border: 1px solid #29425e;
      background: #081422; color: #fff; font: inherit; font-size: 14px; outline: none;
    }
    input:focus { border-color: #28b8bf; box-shadow: 0 0 0 3px rgba(40, 184, 191, .14); }
    .hint { min-height: 18px; margin-top: 8px; color: #e7b86d; font-size: 12px; }
    .err { min-height: 20px; margin: 12px 0 4px; color: #ff8c93; font-size: 12.5px; }
    .actions { display: flex; gap: 10px; margin-top: 14px; }
    .modes { display: grid; grid-template-columns: 1.25fr .75fr; gap: 10px; margin: 0 0 14px; }
    .modebtn {
      text-align: left; padding: 14px; min-height: 92px; background: #0a1727;
      border-color: #223954; line-height: 1.5;
    }
    .modebtn b { display: block; color: #e8f0fa; font-size: 13.5px; margin-bottom: 4px; }
    .modebtn span { display: block; color: #8fa5bd; font-size: 11.5px; }
    .modebtn.on { border-color: #28b8bf; background: rgba(40, 184, 191, .11); box-shadow: 0 0 0 2px rgba(40,184,191,.08); }
    .section { display: none; }
    .section.on { display: block; }
    .existing { padding: 12px 13px; border-radius: 9px; border: 1px solid #2d5c58; background: #0b2424; color: #b8ded9; font-size: 12.5px; line-height: 1.6; }
    button {
      border: 1px solid #35506e; border-radius: 9px; padding: 11px 16px;
      font: inherit; cursor: pointer; color: #d7e3f0; background: #15273c;
    }
    button.primary { flex: 1; background: linear-gradient(135deg, #17a8b4, #34c4a9); border: 0; color: #04141a; font-weight: 700; }
    button:disabled { opacity: .6; cursor: wait; }
    .foot { margin-top: 16px; color: #71859d; font-size: 11.5px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="assets/icon.png" alt="">
      <div><small>LOGISTICS QUOTE</small><h1 id="title">连接中央服务器</h1></div>
    </div>
      <p class="lead" id="lead">客户端统一使用中央服务器账号和价格表。没有服务端账户时无法登录或进入报价系统。</p>
    <form id="form">
      <section class="section on" id="remotePanel">
        <label for="serverUrl">中央服务器地址</label>
        <input id="serverUrl" type="url" autocomplete="url" placeholder="https://quote.example.com">
        <div class="hint">必须使用 HTTPS。客户端会验证服务器 API；本机离线模式已禁用。</div>
      </section>

      <div class="err" id="error"></div>
      <div class="actions">
        <button type="button" id="cancel">取消</button>
        <button class="primary" id="submit" type="submit">连接并进入登录页</button>
      </div>
    </form>
    <div class="foot">强制服务器模式：客户端不会在本机创建管理员、启动离线服务或保存价格表。账号由服务端管理员添加。</div>
  </main>
  <script src="setup.js"></script>
</body>
</html>
